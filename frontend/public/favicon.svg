<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0a0a0f"/>
    </linearGradient>
    <linearGradient id="eye" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="url(#bg)" stroke="#3b82f6" stroke-width="1"/>
  <!-- Eye shape -->
  <ellipse cx="16" cy="16" rx="10" ry="6" fill="none" stroke="url(#eye)" stroke-width="2"/>
  <!-- Iris -->
  <circle cx="16" cy="16" r="4" fill="url(#eye)"/>
  <!-- Pupil -->
  <circle cx="16" cy="16" r="2" fill="#0a0a0f"/>
  <!-- Highlight -->
  <circle cx="14.5" cy="14.5" r="1" fill="#fff" opacity="0.8"/>
</svg>
